services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nivaran
      POSTGRES_PASSWORD: nivaran
      POSTGRES_DB: nivaran
    ports:
      - "5432:5432"
    volumes:
      - nivaran_pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivaran"]
      interval: 5s
      retries: 10
volumes:
  nivaran_pg:
